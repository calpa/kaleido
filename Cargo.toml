[workspace]
resolver = "2"
members = ["crates/kaleido-core", "crates/kaleido-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/calpa/kaleido"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
kamadak-exif = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
wiremock = "0.6"
sha2 = "0.10"
# Heavy inference runtime: only pulled in by the `engine-ort` feature.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
