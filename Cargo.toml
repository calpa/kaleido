[workspace]
resolver = "2"
members = ["crates/kaleido-core", "crates/kaleido-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/calpa/kaleido"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
kamadak-exif = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
