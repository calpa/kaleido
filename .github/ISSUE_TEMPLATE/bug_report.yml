name: Bug report
description: Something broke or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or click path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      description: macOS version, chip, RAM (e.g. macOS 26, M2 8GB)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log output, screenshot, or minimal repro folder structure
