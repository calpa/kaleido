name: Feature request
description: Propose a capability for kaleido
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Concrete; mention local-first implications if network is involved.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - gallery UI
        - analysis core (hash/palette/dupe)
        - OCR ensemble
        - model manager
        - benchmark / machine readiness
        - web search / download
        - other
    validations:
      required: true
