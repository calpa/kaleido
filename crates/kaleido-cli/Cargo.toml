[package]
name = "kaleido-cli"
description = "CLI for kaleido-core: scan, similar-image search, palette extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kaleido"
path = "src/main.rs"

[features]
default = []
engine-ort = ["kaleido-core/engine-ort"]
engine-ort-coreml = ["kaleido-core/engine-ort-coreml"]

[dependencies]
kaleido-core = { path = "../kaleido-core" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
rayon.workspace = true
serde = { workspace = true }
image.workspace = true
